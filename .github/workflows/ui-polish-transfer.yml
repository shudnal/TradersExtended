name: Temporary trader UI source update
on:
  push:
    branches: [fix/trade-focus-stack-dialog-review]
    paths: ['.github/workflows/ui-polish-transfer.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'shudnal/TradersExtended'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply checksum-verified source changes
        shell: python
        run: |
          import base64, gzip, hashlib, subprocess
          encoded = ''
          encoded = encoded.replace('JFJJtx1Svp', 'JFJtx1Svp')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != '99a5ed9d7404f2b3a9fc60d06f1d390593e66a41cdf667d71db9b9551d9e3868':
              raise RuntimeError('Source patch checksum mismatch.')
          subprocess.run(['git', 'apply', '--check', '--whitespace=error'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--whitespace=error'], input=patch, check=True)
      - name: Inspect source metadata and syntax only
        run: |
          git diff --check
          python -m pip install --quiet --only-binary=:all: tree-sitter==0.25.2 tree-sitter-c-sharp==0.23.1
      - name: Parse source without compiling or executing the mod
        shell: python
        run: |
          import json, pathlib, re, xml.etree.ElementTree as ET
          from tree_sitter import Language, Parser
          import tree_sitter_c_sharp
          root = pathlib.Path('.')
          parser = Parser(Language(tree_sitter_c_sharp.language()))
          paths = sorted(root.rglob('*.cs'))
          errors = [str(p) for p in paths if parser.parse(p.read_bytes()).root_node.has_error]
          if errors:
              raise RuntimeError('C# syntax errors: ' + ', '.join(errors))
          ns = {'m': 'http://schemas.microsoft.com/developer/msbuild/2003'}
          project = ET.parse('TradersExtended.csproj')
          compiled = [n.attrib['Include'].replace('\\', '/') for n in project.findall('.//m:Compile', ns)]
          assert len(compiled) == len(set(compiled)) and sorted(compiled) == [str(p) for p in paths]
          assert 'pluginVersion = "2.0.1"' in pathlib.Path('TradersExtended.cs').read_text()
          assert pathlib.Path('README.md').read_bytes() == pathlib.Path('package/thunderstore/TradersExtended/README.md').read_bytes()
          assert project.find('.//m:PackageReference[@Include="YamlDotNet"]/m:Version', ns).text == '16.3.0'
          targets = ET.parse('ILRepack.targets')
          assert not any('YamlDotNet' in n.attrib.get('Include', '') for n in targets.findall('.//*[@Include]'))
          manifest = json.loads(pathlib.Path('package/thunderstore/TradersExtended/manifest.json').read_text())
          assert manifest['version_number'] == '2.0.1' and 'ValheimModding-YamlDotNet-16.3.1' in manifest['dependencies']
          assert json.loads(pathlib.Path('package/nexus/manifest.json').read_text())['version'] == '2.0.1'
          assert not pathlib.Path('tests').exists() and not pathlib.Path('docs').exists()
          assert sorted(p.name for p in root.glob('*.ps1')) == ['UpdateThunderstoreManifest.ps1']
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8-sig')
              except UnicodeError:
                  continue
              assert not re.search('[\u0400-\u04ff]', text), str(path)
          print(f'PASS: {len(paths)} C# files parsed; source metadata and English-text checks passed. No build, game run or C# test execution.')
      - name: Commit changes and remove the temporary transfer workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Suden'
          git config user.email '20457922+shudnal@users.noreply.github.com'
          git rm .github/workflows/ui-polish-transfer.yml
          git add ItemLists/StorePanel.Lists.cs Trading/TradeAmounts.cs Trading/StorePanel.Trading.cs UI/TooltipPrices.cs UI/StorePanel.cs UI/StorePanel.Dragging.cs UI/AmountDialog.cs TradersExtended.cs TradersExtended.csproj README.md package/thunderstore/TradersExtended/README.md package/thunderstore/TradersExtended/CHANGELOG.md
          git diff --cached --check
          git commit -m 'Refine trader discovery, amount pricing and movable panels'
          git push origin HEAD:refs/heads/fix/trade-focus-stack-dialog-review
          git rev-parse HEAD
      - name: Export final source hashes
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          result = {'head': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
                    'hashes': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths if p}}
          pathlib.Path('/tmp/trader-ui-hashes.json').write_text(json.dumps(result, indent=2) + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: trader-ui-hashes
          path: /tmp/trader-ui-hashes.json
          retention-days: 1
          if-no-files-found: error
