name: Temporary trader UI source transfer
on:
  push:
    branches: [fix/trade-focus-stack-dialog-review]
    paths: ['.github/workflows/ui-polish-transfer.yml']
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'shudnal/TradersExtended'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export public sources without executing them
        shell: python
        run: |
          import subprocess, urllib.request, zipfile
          with zipfile.ZipFile('/tmp/trader-ui-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
                  if path:
                      archive.write(path, 'repository/' + path)
              ref = 'b3b703a97a44c899e83fc80314373ce45f98a9b0'
              for path in ['UIDragging.cs', 'EquipmentPanel.cs', 'ExtraSlots.cs']:
                  with urllib.request.urlopen(f'https://raw.githubusercontent.com/shudnal/ExtraSlots/{ref}/{path}', timeout=30) as response:
                      archive.writestr(f'references/ExtraSlots/{path}', response.read())
          print('Exported public source only; no game references, build, test or publishing commands.')
      - uses: actions/upload-artifact@v4
        with:
          name: trader-ui-source
          path: /tmp/trader-ui-source.zip
          retention-days: 1
          if-no-files-found: error
