name: Temporary source cleanup
on:
  push:
    branches: [fix/trade-focus-stack-dialog-review]
    paths: ['.github/workflows/source-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'shudnal/TradersExtended'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Decode checked temporary source editing tools
        shell: python
        run: |
          import base64, gzip, hashlib, json, pathlib
          encoded = ''
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(data).hexdigest() != '1e7a17a8191cf4fdc977b9fc21ccafe3e76d782f69172e06975950bd1b007aef':
              raise RuntimeError('Temporary source tool checksum mismatch.')
          files = json.loads(data)
          if set(files) != {'cleanup_traders.py', 'check_moved_sources.py'}:
              raise RuntimeError('Unexpected temporary source tool names.')
          for name, content in files.items():
              pathlib.Path('/tmp', name).write_text(content)
      - name: Remove publishing automation and restore external YAML
        run: |
          python /tmp/cleanup_traders.py packaging
          python /tmp/cleanup_traders.py validate
          git diff --check
          git config user.name 'Suden'
          git config user.email '20457922+shudnal@users.noreply.github.com'
          git add -A
          git commit -m 'Remove upload tooling and restore the shared YAML dependency'
      - name: Organize source ownership without compiling or running the mod
        run: |
          python /tmp/cleanup_traders.py sources
          python /tmp/cleanup_traders.py validate
          git diff --check
          python -m pip install --quiet --only-binary=:all: tree-sitter==0.25.2 tree-sitter-c-sharp==0.23.1
          python /tmp/check_moved_sources.py
      - name: Parse the remaining manifest script without executing it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'UpdateThunderstoreManifest.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          Write-Host 'PASS: PowerShell syntax only; no script execution.'
      - name: Remove temporary workflow and commit the organized sources
        run: |
          git rm .github/workflows/source-cleanup.yml
          git add -A
          git diff --cached --check
          git commit -m 'Organize trading, interface, item lists, and editor implementation'
          git push origin HEAD:refs/heads/fix/trade-focus-stack-dialog-review
      - name: Record source hashes
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          hashes = {path: hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() for path in paths if path}
          result = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(), 'sha256': hashes}
          pathlib.Path('/tmp/cleanup-result.json').write_text(json.dumps(result, indent=2) + '\n')
          print(result['commit'], len(hashes), 'tracked files')
      - uses: actions/upload-artifact@v4
        with:
          name: cleanup-result
          path: /tmp/cleanup-result.json
          retention-days: 1
          if-no-files-found: error
