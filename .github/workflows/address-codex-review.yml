name: Apply Codex review fixes
on:
  push:
    branches:
      - fix/trade-focus-stack-dialog-review
    paths:
      - .github/workflows/address-codex-review.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Guard source materialization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --pretty=%s)" = "Run Codex review fix materialization"
      - name: Apply reviewed source changes
        run: python .review-fix/apply.py
      - name: Run source-only repository checks
        shell: bash
        run: |
          set -euo pipefail
          python tests/check_repository.py
          git diff --check
          python -m pip install --quiet --only-binary=:all: tree-sitter==0.25.2 tree-sitter-c-sharp==0.23.1
      - name: Parse C# syntax without compilation or execution
        shell: python
        run: |
          import pathlib
          from tree_sitter import Language, Parser
          import tree_sitter_c_sharp
          parser = Parser(Language(tree_sitter_c_sharp.language()))
          errors = []
          paths = sorted(pathlib.Path('.').rglob('*.cs'))
          for path in paths:
              tree = parser.parse(path.read_bytes())
              if not tree.root_node.has_error:
                  continue
              nodes = [tree.root_node]
              while nodes:
                  node = nodes.pop()
                  if node.is_error or node.is_missing:
                      errors.append(f'{path}:{node.start_point}: {node.type}')
                  nodes.extend(reversed(node.children))
          if errors:
              raise RuntimeError('\n'.join(errors))
          print(f'PASS: {len(paths)} C# files parsed; no compilation or runtime test performed.')
      - name: Commit fixes and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Suden'
          git config user.email '20457922+shudnal@users.noreply.github.com'
          git add StorePanel.cs TradeInventory.cs tests/Regression/Program.cs docs/reviews/2026-09-07-repository-review.md
          git rm -r .review-fix .github/workflows/address-codex-review.yml
          git commit -m 'Address Codex trade capacity and offer identity review'
          git push origin HEAD:refs/heads/fix/trade-focus-stack-dialog-review
