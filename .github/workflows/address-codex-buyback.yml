name: Apply buyback preflight review fix
on:
  push:
    branches: [fix/trade-focus-stack-dialog-review]
    paths: ['.github/workflows/address-codex-buyback.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Stage buyback preflight review fix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed source changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one replacement target, found {count}')
              file.write_text(text.replace(old, new))

          replace_once('TradeInventory.cs', '''        internal static bool CanAddSavedItems(Inventory inventory, IEnumerable<ItemDrop.ItemData> items)
        {
            if (inventory == null || items == null)
                return false;
            int emptySlots = Math.Max(inventory.GetEmptySlots(), 0);
            List<SavedStackSpace> freeStacks = inventory.GetAllItems().Select(item => new SavedStackSpace
            {
                Item = item,
                Space = Math.Max(item.m_shared.m_maxStackSize - item.m_stack, 0)
            }).ToList();
            foreach (ItemDrop.ItemData saved in items)
            {
                if (saved?.m_shared == null || saved.m_dropPrefab == null || saved.m_stack <= 0 || saved.m_shared.m_maxStackSize <= 0)
                    return false;
                long remaining = saved.m_stack;
                foreach (SavedStackSpace stack in freeStacks)
                {
                    if (stack.Space <= 0 || !CanMergeSavedItem(stack.Item, saved))
                        continue;
                    long added = Math.Min(remaining, stack.Space);
                    stack.Space -= added;
                    remaining -= added;
                    if (remaining == 0)
                        break;
                }
                long slots = (remaining + saved.m_shared.m_maxStackSize - 1) / saved.m_shared.m_maxStackSize;
                if (slots > emptySlots)
                    return false;
                emptySlots -= (int)slots;
                if (slots > 0)
                    freeStacks.Add(new SavedStackSpace
                    {
                        Item = saved,
                        Space = slots * saved.m_shared.m_maxStackSize - remaining
                    });
            }
            return true;
        }
''', '''        internal static bool CanAddSavedItems(Inventory inventory, IEnumerable<ItemDrop.ItemData> items)
        {
            if (inventory == null || items == null)
                return false;
            List<SavedStackSpace> freeStacks = new List<SavedStackSpace>();
            foreach (ItemDrop.ItemData existing in inventory.GetAllItems())
            {
                if (existing?.m_shared == null)
                    return false;
                freeStacks.Add(new SavedStackSpace
                {
                    Item = existing,
                    Space = Math.Max(existing.m_shared.m_maxStackSize - existing.m_stack, 0)
                });
            }
            return CanAddSavedItems(items, Math.Max(inventory.GetEmptySlots(), 0), freeStacks);
        }

        internal static bool CanAddSavedItemsAfterRemoval(Inventory inventory, IEnumerable<ItemDrop.ItemData> items,
            IEnumerable<Removal> removal)
        {
            if (inventory == null || items == null)
                return false;

            Dictionary<ItemDrop.ItemData, int> removedAmounts = new Dictionary<ItemDrop.ItemData, int>();
            if (removal != null)
                foreach (Removal part in removal)
                {
                    if (part?.Item == null || part.Amount <= 0 || !inventory.ContainsItem(part.Item))
                        return false;
                    long combined = (long)(removedAmounts.TryGetValue(part.Item, out int current) ? current : 0) + part.Amount;
                    if (combined > part.Item.m_stack)
                        return false;
                    removedAmounts[part.Item] = (int)combined;
                }

            int emptySlots = Math.Max(inventory.GetEmptySlots(), 0);
            List<SavedStackSpace> freeStacks = new List<SavedStackSpace>();
            foreach (ItemDrop.ItemData existing in inventory.GetAllItems())
            {
                if (existing?.m_shared == null)
                    return false;
                int removed = removedAmounts.TryGetValue(existing, out int planned) ? planned : 0;
                int remaining = existing.m_stack - removed;
                if (remaining <= 0)
                {
                    if (existing.m_stack > 0)
                        emptySlots++;
                    continue;
                }
                freeStacks.Add(new SavedStackSpace
                {
                    Item = existing,
                    Space = Math.Max(existing.m_shared.m_maxStackSize - remaining, 0)
                });
            }
            return CanAddSavedItems(items, emptySlots, freeStacks);
        }

        private static bool CanAddSavedItems(IEnumerable<ItemDrop.ItemData> items, int emptySlots,
            List<SavedStackSpace> freeStacks)
        {
            foreach (ItemDrop.ItemData saved in items)
            {
                if (saved?.m_shared == null || saved.m_dropPrefab == null || saved.m_stack <= 0 || saved.m_shared.m_maxStackSize <= 0)
                    return false;
                long remaining = saved.m_stack;
                foreach (SavedStackSpace stack in freeStacks)
                {
                    if (stack.Space <= 0 || !CanMergeSavedItem(stack.Item, saved))
                        continue;
                    long added = Math.Min(remaining, stack.Space);
                    stack.Space -= added;
                    remaining -= added;
                    if (remaining == 0)
                        break;
                }
                long slots = (remaining + saved.m_shared.m_maxStackSize - 1) / saved.m_shared.m_maxStackSize;
                if (slots > emptySlots)
                    return false;
                emptySlots -= (int)slots;
                if (slots > 0)
                    freeStacks.Add(new SavedStackSpace
                    {
                        Item = saved,
                        Space = slots * saved.m_shared.m_maxStackSize - remaining
                    });
            }
            return true;
        }
''')

          replace_once('StorePanel.cs', '''            if (!TradeInventory.PlanRemoval(inventory,
                inventory.GetAllItems().Where(item => TradeInventory.MatchesCurrency(item, offer.currency)), offer.price,
                out List<TradeInventory.Removal> payment))
                return false;
            using (TradeInventory.Snapshot snapshot = new TradeInventory.Snapshot(inventory))
''', '''            if (!TradeInventory.PlanRemoval(inventory,
                inventory.GetAllItems().Where(item => TradeInventory.MatchesCurrency(item, offer.currency)), offer.price,
                out List<TradeInventory.Removal> payment) ||
                !TradeInventory.CanAddSavedItemsAfterRemoval(inventory, offer.soldItems, payment))
                return false;
            using (TradeInventory.Snapshot snapshot = new TradeInventory.Snapshot(inventory))
''')

          replace_once('StorePanel.cs', '''                    // Preflight the cached receipt. BuyBackItem rechecks persistence and expiry on click.
                    ItemToSell receipt = buybackItem;
                    bool affordable = __instance.CanAfford(item);
                    bool fits = receipt?.soldItems != null && Player.m_localPlayer != null &&
                        TradeInventory.CanAddSavedItems(Player.m_localPlayer.GetInventory(), receipt.soldItems);
                    __instance.m_buyButton.interactable = affordable && fits;
                    __instance.m_buyButton.GetComponent<UITooltip>().m_text = affordable && fits ? string.Empty :
                        Localization.instance.Localize(affordable ? "$inventory_full" : "$msg_missingrequirement");
''', '''                    // Preflight the cached receipt against the same post-payment state used by BuyBackItem.
                    ItemToSell receipt = buybackItem;
                    Inventory inventory = Player.m_localPlayer?.GetInventory();
                    bool affordable = receipt?.soldItems != null && receipt.currency != null && receipt.price > 0 && inventory != null &&
                        TradeInventory.PlanRemoval(inventory,
                            inventory.GetAllItems().Where(existing => TradeInventory.MatchesCurrency(existing, receipt.currency)),
                            receipt.price, out List<TradeInventory.Removal> payment);
                    bool fits = affordable && TradeInventory.CanAddSavedItemsAfterRemoval(inventory, receipt.soldItems, payment);
                    __instance.m_buyButton.interactable = affordable && fits;
                    __instance.m_buyButton.GetComponent<UITooltip>().m_text = affordable && fits ? string.Empty :
                        Localization.instance.Localize(affordable ? "$inventory_full" : "$msg_missingrequirement");
''')

          replace_once('tests/Regression/Program.cs', '''        Check(TradeInventory.CapacityAfterRemoval(inventory, coins.m_itemData, 1, 1, partialPayment) == 95,
            "When the bought item is also the currency, planned removal exposes stack space without double-counting slots");

        inventory = new Inventory { Slots = 3 };
''', '''        Check(TradeInventory.CapacityAfterRemoval(inventory, coins.m_itemData, 1, 1, partialPayment) == 95,
            "When the bought item is also the currency, planned removal exposes stack space without double-counting slots");

        var buyback = Prefab("Buyback", 1);
        var savedBuyback = Stack(buyback, 1, world: 1);
        Check(!TradeInventory.CanAddSavedItems(inventory, new[] { savedBuyback }),
            "A full inventory cannot restore buyback before accounting for payment");
        Check(TradeInventory.CanAddSavedItemsAfterRemoval(inventory, new[] { savedBuyback }, fullPayment),
            "Buyback preflight sees a slot freed by fully consumed payment currency");
        Check(!TradeInventory.CanAddSavedItemsAfterRemoval(inventory, new[] { savedBuyback }, partialPayment),
            "Partial buyback payment does not invent a free slot");

        inventory = new Inventory { Slots = 3 };
''')

          review = Path('docs/reviews/2026-09-07-repository-review.md')
          text = review.read_text()
          marker = '- Buy-offer restoration identity now includes `m_price`, preventing two otherwise identical configured offers with different prices from being silently interchanged after a list refresh.\n'
          addition = marker + '- Buyback capacity now uses the projected inventory after its exact currency-removal plan, matching the actual transaction order and allowing a fully consumed payment stack to free the slot needed for the receipt. The click path performs the same preflight before mutating inventory.\n'
          if text.count(marker) != 1:
              raise RuntimeError('review follow-up marker not found exactly once')
          review.write_text(text.replace(marker, addition))
      - name: Run source-only repository checks
        run: |
          python tests/check_repository.py
          git diff --check
          python -m pip install --quiet --only-binary=:all: tree-sitter==0.25.2 tree-sitter-c-sharp==0.23.1
      - name: Parse C# syntax without compilation or execution
        shell: python
        run: |
          import pathlib
          from tree_sitter import Language, Parser
          import tree_sitter_c_sharp
          parser = Parser(Language(tree_sitter_c_sharp.language()))
          errors = []
          paths = sorted(pathlib.Path('.').rglob('*.cs'))
          for path in paths:
              tree = parser.parse(path.read_bytes())
              if not tree.root_node.has_error:
                  continue
              nodes = [tree.root_node]
              while nodes:
                  node = nodes.pop()
                  if node.is_error or node.is_missing:
                      errors.append(f'{path}:{node.start_point}: {node.type}')
                  nodes.extend(reversed(node.children))
          if errors:
              raise RuntimeError('\n'.join(errors))
          print(f'PASS: {len(paths)} C# files parsed; no compilation or runtime test performed.')
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Suden'
          git config user.email '20457922+shudnal@users.noreply.github.com'
          git add StorePanel.cs TradeInventory.cs tests/Regression/Program.cs docs/reviews/2026-09-07-repository-review.md
          git rm .github/workflows/address-codex-buyback.yml
          git commit -m 'Preflight buyback against post-payment inventory'
          git push origin HEAD:refs/heads/fix/trade-focus-stack-dialog-review
