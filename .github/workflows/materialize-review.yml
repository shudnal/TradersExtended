name: Materialize reviewed source only
on:
  push:
    branches: [fix/trade-focus-stack-dialog-review]
    paths: ['.github/workflows/materialize-review.yml']
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'shudnal/TradersExtended'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply checksum-verified source patches
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib, subprocess
          root = pathlib.Path('.')
          def decode(pattern, count, expected, output):
              parts = sorted(root.glob(pattern))
              if len(parts) != count:
                  raise RuntimeError('Unexpected source patch part count.')
              data = gzip.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
              if hashlib.sha256(data).hexdigest() != expected:
                  raise RuntimeError('Source patch checksum mismatch.')
              pathlib.Path(output).write_bytes(data)
          decode('.review-import/part*.txt', 7, 'd69a8be3b86df010a94cf020f5b7c23bb40a81f4f11d23cdecd9abe7b8282fbd', '/tmp/original.patch')
          decode('.review-import/correction*.txt', 3, 'bf6ce0263af40db3359d99b5c1571cce80ced9c67d1f3cc65e8f186cd4495ea1', '/tmp/corrections.patch')
          subprocess.run(['git', 'apply', '--unidiff-zero', '--exclude=package/thunderstore/TradersExtended/manifest.json', '--exclude=.github/workflows/*', '/tmp/original.patch'], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '/tmp/corrections.patch'], check=True)
          subprocess.run(['git', 'rm', '-r', '.review-import'], check=True)
          print('Both reviewed patches applied. No game, build, or C# test execution.')
      - name: Check source and package invariants
        run: |
          python tests/check_repository.py
          git diff --check
          python -m pip install --quiet --only-binary=:all: tree-sitter==0.25.2 tree-sitter-c-sharp==0.23.1
      - name: Parse C# syntax without compiling or executing it
        shell: python
        run: |
          import pathlib
          from tree_sitter import Language, Parser
          import tree_sitter_c_sharp
          parser = Parser(Language(tree_sitter_c_sharp.language()))
          paths = sorted(pathlib.Path('.').rglob('*.cs'))
          errors = []
          for path in paths:
              tree = parser.parse(path.read_bytes())
              if tree.root_node.has_error:
                  nodes = [tree.root_node]
                  while nodes:
                      node = nodes.pop()
                      if node.is_error or node.is_missing:
                          errors.append(f'{path}:{node.start_point}: {node.type}')
                      nodes.extend(reversed(node.children))
          if errors:
              raise RuntimeError('\n'.join(errors))
          print(f'PASS: {len(paths)} C# files parsed. No type checking, compilation, or runtime test performed.')
      - name: Parse publishing scripts without executing them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem -LiteralPath . -Filter '*.ps1') {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          Write-Host 'PASS: PowerShell syntax only; no publishing script executed.'
      - name: Commit reviewed changes to the existing feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Suden'
          git config user.email '20457922+shudnal@users.noreply.github.com'
          git reset
          git add AmountDialog.cs BuybackManager.cs CoinsPatches.cs StorePanel.cs TooltipPrices.cs TradeAmounts.cs TradeInventory.cs TradeSelection.cs TraderCoins.cs TraderCurrency.cs TradeableItem.cs RepairPanel.cs
          git commit -m 'Preserve trade focus and support safe whole-lot transactions'
          git add ConfigEditor.cs ConfigEditorData.cs ConfigEditorGuiScale.cs ConfigEditorTransport.cs ConfigPersistence.cs CsvRecords.cs EditorTransferBuffer.cs TraderConfig.cs TradersExtended.cs TradersExtended.csproj
          git commit -m 'Harden editor state, authenticated transfers, and configuration persistence'
          git add -A
          git commit -m 'Document repository review and align packaging with checked source'
          git push origin HEAD:refs/heads/fix/trade-focus-stack-dialog-review
          git rev-parse HEAD
      - name: Export source verification manifest
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          hashes = {path: hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() for path in files if path and not path.startswith('.github/')}
          pathlib.Path('/tmp/review-source-hashes.json').write_text(json.dumps(hashes, indent=2) + '\n')
          print('Verified tracked file count:', len(hashes))
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-source-hashes
          path: /tmp/review-source-hashes.json
          retention-days: 3
          if-no-files-found: error
