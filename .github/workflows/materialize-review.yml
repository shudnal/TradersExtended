name: Recover staged review sources
on:
  push:
    branches: [fix/trade-focus-stack-dialog-review]
    paths: ['.github/workflows/materialize-review.yml']
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'shudnal/TradersExtended'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export tracked source and decode the archived patch for inspection only
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib, subprocess, zipfile
          root = pathlib.Path('.')
          parts = sorted(root.glob('.review-import/part*.txt'))
          if len(parts) != 7:
              raise RuntimeError('Expected exactly seven archived patch parts.')
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          if hashlib.sha256(patch).hexdigest() != 'd69a8be3b86df010a94cf020f5b7c23bb40a81f4f11d23cdecd9abe7b8282fbd':
              raise RuntimeError('Archived patch checksum mismatch.')
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile('review-recovery.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in paths:
                  if path:
                      archive.write(path, 'repository/' + path)
              archive.writestr('archived-review.patch', patch)
          print('Archived patch integrity verified; no patch applied and no code executed.')
          print('Patch bytes:', len(patch))
          print('Tracked files:', len(paths) - 1)
      - uses: actions/upload-artifact@v4
        with:
          name: review-recovery
          path: review-recovery.zip
          retention-days: 3
          if-no-files-found: error
